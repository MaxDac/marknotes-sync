[package]
name = "marknotes-sync"
description = "Shared sync core for the MarkNotes apps: sync planner, three-way merge, manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "marknotes_sync"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# UniFFI scaffolding for the Kotlin (Android and JVM) bindings.
uniffi = ["dep:uniffi"]
# wasm-bindgen exports for the npm package (Electron and web).
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uniffi = { version = "0.32", optional = true }
# Pinned: must match the wasm-bindgen CLI used by bindings/npm/build.mjs and CI.
wasm-bindgen = { version = "=0.2.129", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
