name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the wasm-bindgen version pinned in crates/marknotes-sync/Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  rust:
    name: Rust (fmt, clippy, tests, spec fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  npm:
    name: npm package (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build, test and pack
        working-directory: bindings/npm
        run: |
          npm run build
          npm test
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: bindings/npm/*.tgz

  kotlin:
    name: Kotlin bindings (JVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/kotlin-bindings.sh
      - run: ./gradlew test --console=plain
        working-directory: bindings/kotlin

  android:
    name: Android libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: scripts/android-libs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-libs
          path: bindings/kotlin/natives/android

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
