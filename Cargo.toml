[workspace]
resolver = "2"
members = ["crates/marknotes-sync", "uniffi-bindgen"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/MaxDac/marknotes-sync"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
